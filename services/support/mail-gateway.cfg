# TCP pass-through only. Zammad verifies Mailbux's TLS certificate end to end.
# No dynamic destinations, HTTP proxy, TLS termination, or message logging.
global
    maxconn 24
    nbthread 1

defaults
    mode tcp
    timeout connect 10s
    timeout client 120s
    timeout server 120s

# Bypass Docker's internal alias for my.mailbux.com when resolving the upstream.
resolvers public_dns
    nameserver cloudflare 1.1.1.1:53
    nameserver cloudflare_secondary 1.0.0.1:53
    resolve_retries 3
    timeout resolve 2s
    timeout retry 2s
    hold valid 60s

listen imap
    bind :993
    server mailbux my.mailbux.com:993 resolvers public_dns resolve-prefer ipv4 init-addr none

listen smtp
    bind :587
    server mailbux my.mailbux.com:587 resolvers public_dns resolve-prefer ipv4 init-addr none
