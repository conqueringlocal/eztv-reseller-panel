# Optional controlled email connectivity. Rails/jobs/data stay internal-only.
networks:
  mail_egress:
    driver: bridge
services:
  mail-gateway:
    image: haproxy@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    restart: unless-stopped
    networks:
      default:
        aliases: [my.mailbux.com]
      mail_egress: {}
    volumes:
      - ./local/mail-gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: [CMD, haproxy, -c, -f, /usr/local/etc/haproxy/haproxy.cfg]
      interval: 60s
      timeout: 5s
      retries: 3
